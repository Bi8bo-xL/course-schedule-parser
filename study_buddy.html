<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>👭 学习搭子匹配器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #e8f4f8 0%, #d9eef5 100%);
            padding: 32px 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(120deg, #7ab8d4, #a8d8ea);
            padding: 28px 32px;
            color: white;
        }
        .header h1 { font-size: 28px; display: flex; align-items: center; gap: 10px; }
        .stats { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .stat-badge { background: rgba(255,255,255,0.25); padding: 6px 18px; border-radius: 40px; font-size: 13px; }

        .tabs { display: flex; gap: 8px; padding: 16px 24px; background: rgba(255,255,255,0.5); flex-wrap: wrap; }
        .tab { padding: 8px 20px; border-radius: 40px; cursor: pointer; font-size: 14px; color: #5a8faa; transition: 0.2s; }
        .tab.active { background: #7ab8d4; color: white; }
        .tab-content { display: none; padding: 24px; }
        .tab-content.active { display: block; }

        .student-card {
            background: white;
            border-radius: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(122,184,212,0.3);
            overflow: hidden;
        }
        .student-header {
            background: #f0f8fc;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #5a7a8a;
        }
        .delete-btn { background: #e0ecf2; border: none; padding: 4px 14px; border-radius: 30px; cursor: pointer; }

        .match-section { padding: 18px 22px; border-bottom: 1px solid #e0ecf2; }
        .match-title { font-weight: 600; color: #5a8faa; margin-bottom: 12px; display: flex; gap: 8px; }
        .match-badge { background: #e0ecf2; padding: 2px 12px; border-radius: 30px; font-size: 12px; }

        .course-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .course-card { background: #f0f8fc; padding: 10px 16px; border-radius: 20px; border-left: 3px solid #7ab8d4; }
        .course-name { font-weight: 600; color: #5a8faa; }
        .course-detail { font-size: 12px; color: #8aaec0; margin-top: 4px; }

        /* 时间轴 */
        .timeline-container { background: #f0f8fc; border-radius: 24px; padding: 16px; margin-top: 12px; }
        .timeline-day { margin-bottom: 16px; }
        .timeline-day-header { font-weight: 600; color: #5a7a8a; margin-bottom: 6px; }
        .timeline-track { background: #e0ecf2; border-radius: 30px; height: 36px; display: flex; overflow: hidden; }
        .timeline-segment { height: 100%; transition: 0.2s; }
        .timeline-segment.free { background: #b8dfd0; }
        .timeline-segment.busy { background: #d4e5ec; }
        .timeline-segment.same { background: #ffc8a2; }

        .legend { display: flex; gap: 20px; margin-top: 16px; justify-content: center; }
        .legend-dot { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; }
        .legend-dot.free { background: #b8dfd0; }
        .legend-dot.busy { background: #d4e5ec; }
        .legend-dot.same { background: #ffc8a2; }
        .legend-item { font-size: 12px; color: #718096; }

        .free-tag { background: #b8dfd0; color: #2d6a5e; padding: 5px 14px; border-radius: 30px; font-size: 12px; display: inline-block; margin: 4px 6px 0 0; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #5a8faa; font-weight: 500; }
        input, textarea { width: 100%; padding: 12px 16px; border: 1px solid #cde3ec; border-radius: 28px; font-size: 14px; background: white; }
        textarea { height: 180px; border-radius: 20px; }
        .btn { background: #7ab8d4; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; margin-right: 10px; }
        .btn-secondary { background: #d4e5ec; color: #5a7a8a; }
        .empty-state { text-align: center; padding: 40px; color: #8aaec0; }
        .footer { text-align: center; padding: 16px; font-size: 12px; color: #8aaec0; background: rgba(255,255,255,0.5); }
        @media (max-width: 700px) { .match-section { padding: 14px; } .tabs { padding: 12px 16px; } .tab { padding: 6px 14px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="glass-card">
        <div class="header">
            <h1>👭 学习搭子匹配器</h1>
            <p>🌸 找到一起上课、一起自习的小伙伴</p>
            <div class="stats" id="statsPanel"><div class="stat-badge">👥 同学 <span id="studentCount">0</span> 人</div><div class="stat-badge">📚 相同课 <span id="sameCourseCount">0</span></div><div class="stat-badge">⏰ 空闲 <span id="freeTimeCount">0</span></div></div>
        </div>
        <div class="tabs"><div class="tab active" data-tab="match">🌸 匹配结果</div><div class="tab" data-tab="add">➕ 添加同学</div><div class="tab" data-tab="list">📋 同学列表</div><div class="tab" data-tab="myself">📖 我的课表</div></div>
        <div id="matchTab" class="tab-content active"><div id="matchResults"></div></div>
        <div id="addTab" class="tab-content"><div class="form-group"><label>📝 同学姓名</label><input type="text" id="studentName" placeholder="例：小羽"></div><div class="form-group"><label>📚 课表内容</label><textarea id="studentSchedule" placeholder="周一1-2节 课程名 教室&#10;周二3-4节 课程名 教室"></textarea></div><button class="btn" onclick="addStudent()">✨ 添加同学</button><button class="btn btn-secondary" onclick="clearForm()">清空</button><div class="empty-state" style="padding:12px; text-align:left; font-size:12px">💡 格式：周一1-2节 高等数学 教2-101</div></div>
        <div id="listTab" class="tab-content"><div id="studentList"></div></div>
        <div id="myselfTab" class="tab-content"><div id="myScheduleDisplay"></div><button class="btn" onclick="resetMySchedule()" style="margin-top:12px">🔄 重置默认课表</button></div>
        <div class="footer">🍃 数据保存在浏览器中</div>
    </div>
</div>
<script>
    let students = {}, myCourses = null;
    const weekdayMap = {"周一":1,"周二":2,"周三":3,"周四":4,"周五":5};
    const weekdayNames = ["","周一","周二","周三","周四","周五"];
    const slotTimes = {1:"8:00",2:"8:00",3:"9:50",4:"9:50",5:"13:30",6:"13:30",7:"15:20",8:"15:20",9:"18:30",10:"18:30",11:"20:20",12:"20:20"};
    function parseSchedule(t){let c=[];for(let l of t.trim().split('\n')){l=l.trim();if(!l)continue;let m=l.match(/([周一二三四五]+)(\d+)-(\d+)节\s+(.+?)\s+(\S+)$/);if(m){let w=null;for(let k in weekdayMap)if(m[1].includes(k)){w=weekdayMap[k];break}if(w&&w>=1&&w<=5)c.push({name:m[4],weekday:w,startSlot:parseInt(m[2]),endSlot:parseInt(m[3]),room:m[5]})}}return c}
    function getCourseKey(c){return c.name+'|'+c.room}
    function getBusy(courses){let b={};for(let d=1;d<=5;d++){b[d]={};for(let s=1;s<=12;s++)b[d][s]=false}for(let c of courses)for(let s=c.startSlot;s<=c.endSlot;s++)b[c.weekday][s]=true;return b}
    function findSame(my,their){let myMap={};for(let c of my){let k=getCourseKey(c);if(!myMap[k])myMap[k]=[];myMap[k].push(c)}let same=[];for(let c of their){let k=getCourseKey(c);if(myMap[k]){for(let mc of myMap[k]){if(mc.weekday===c.weekday&&mc.startSlot===c.startSlot){same.push({name:c.name,room:c.room,weekday:c.weekday,weekdayName:weekdayNames[c.weekday],timeRange:`${c.startSlot}-${c.endSlot}节`});break}}}}return same}
    function findFree(my,their){let myB=getBusy(my),theirB=getBusy(their),free=[];for(let d=1;d<=5;d++)for(let s=1;s<=12;s++)if(!myB[d][s]&&!theirB[d][s])free.push({day:d,dayName:weekdayNames[d],slot:s,timeRange:slotTimes[s]});return free}
    function renderTimeline(my,their,same){let myB=getBusy(my),theirB=getBusy(their),sameSet=new Set();for(let c of same)sameSet.add(c.weekday+'|'+c.timeRange.split('-')[0]);let html='<div class="timeline-container"><div class="legend"><span class="legend-item"><span class="legend-dot free"></span>共同空闲</span><span class="legend-item"><span class="legend-dot busy"></span>有课</span><span class="legend-item"><span class="legend-dot same"></span>相同课程</span></div>';for(let d=1;d<=5;d++){html+=`<div class="timeline-day"><div class="timeline-day-header">📅 ${weekdayNames[d]}</div><div class="timeline-track">`;for(let s=1;s<=12;s++){let isSame=sameSet.has(d+'|'+s),isFree=!myB[d][s]&&!theirB[d][s];let cls='busy';if(isSame)cls='same';else if(isFree)cls='free';html+=`<div class="timeline-segment ${cls}" style="width:8.33%" title="${weekdayNames[d]} ${slotTimes[s]}"></div>`}html+=`</div></div>`}html+=`</div>`;return html}
    function getDefaultMy(){return`周一1-2节 计算机网络 n113\n周一3-4节 人工智能 n522\n周一5-6节 五彩缤纷的现代多媒体生活（通核）8302\n周二1-2节 计算机组成原理 n217\n周二3-4节 数据库原理 n213\n周二5-6节 社会调查方法（混合课堂）7307\n周二7-8节 毛泽东思想和中国特色社会主义 n111\n周三1-2节 Java语言程序设计 n213\n周三3-4节 机器学习 n323\n周三5-6节 形势与政策（4）n215\n周四1-2节 Java语言程序设计 n213\n周四3-4节 数据库原理 n213\n周四5-6节 计算机网络 n217\n周四11-12节 计算机组成原理 n112\n周五1-2节 Python程序设计 n113\n周五3-4节 毛泽东思想和中国特色社会主义 n111\n周五5-6节 传播心理学 8214\n周五7-8节 大学体育4 舞二`}
    function loadMy(){let s=localStorage.getItem('my_schedule_text_v2');if(s)myCourses=parseSchedule(s);else myCourses=parseSchedule(getDefaultMy());return myCourses}
    function saveMy(t){localStorage.setItem('my_schedule_text_v2',t);myCourses=parseSchedule(t);renderAll()}
    function resetMy(){if(confirm('重置默认课表？'))saveMy(getDefaultMy())}
    function loadStudents(){let s=localStorage.getItem('study_buddy_v3');if(s)students=JSON.parse(s)}
    function saveStudents(){localStorage.setItem('study_buddy_v3',JSON.stringify(students));renderAll()}
    function addStudent(){let n=document.getElementById('studentName').value.trim(),t=document.getElementById('studentSchedule').value.trim();if(!n){alert('请输入同学姓名');return}if(!t){alert('请输入课表');return}let c=parseSchedule(t);if(!c.length){alert('课表解析失败，检查格式');return}students[n]={courses:c,rawText:t,addedTime:new Date().toISOString()};saveStudents();clearForm();document.querySelector('.tab[data-tab="match"]').click()}
    function deleteStudent(n){if(confirm(`删除 ${n}？`)){delete students[n];saveStudents()}}
    function clearForm(){document.getElementById('studentName').value='';document.getElementById('studentSchedule').value=''}
    function renderMatch(){let names=Object.keys(students),container=document.getElementById('matchResults');if(!names.length){container.innerHTML='<div class="empty-state">🌸 还没有同学～ 点击「添加同学」录入课表吧</div>';document.getElementById('studentCount').innerText='0';document.getElementById('sameCourseCount').innerText='0';document.getElementById('freeTimeCount').innerText='0';return}let totalSame=0,totalFree=0,html='';for(let name of names){let s=students[name],same=findSame(myCourses,s.courses),free=findFree(myCourses,s.courses);totalSame+=same.length;totalFree+=free.length;html+=`<div class="student-card"><div class="student-header"><span>👤 ${name}</span><button class="delete-btn" onclick="deleteStudent('${name}')">删除</button></div><div class="match-section"><div class="match-title">📖 相同课程 <span class="match-badge">${same.length}</span></div><div class="course-list">`;if(same.length)for(let c of same)html+=`<div class="course-card"><div class="course-name">${c.name}</div><div class="course-detail">📍 ${c.room} · ${c.weekdayName} ${c.timeRange}</div></div>`;else html+=`<div class="empty-state" style="padding:12px">✨ 暂无相同课程～可以约着一起自习</div>`;html+=`</div></div><div class="match-section"><div class="match-title">⏰ 共同空闲 <span class="match-badge">${free.length}</span></div>`;html+=renderTimeline(myCourses,s.courses,same);if(free.length){html+=`<div class="free-time-summary" style="margin-top:12px">`;for(let f of free.slice(0,6))html+=`<span class="free-tag">${f.dayName} ${f.timeRange}</span>`;if(free.length>6)html+=`<span class="free-tag">+${free.length-6} 更多</span>`;html+=`</div>`}else html+=`<div class="empty-state" style="padding:12px">😢 暂无共同空闲时间～</div>`;html+=`</div></div>`}document.getElementById('studentCount').innerText=names.length;document.getElementById('sameCourseCount').innerText=totalSame;document.getElementById('freeTimeCount').innerText=totalFree;container.innerHTML=html}
    function renderList(){let names=Object.keys(students),container=document.getElementById('studentList');if(!names.length){container.innerHTML='<div class="empty-state">📭 还没有同学～</div>';return}let html='';for(let name of names){let s=students[name];html+=`<div class="student-card"><div class="student-header"><span>👤 ${name}</span><button class="delete-btn" onclick="deleteStudent('${name}')">删除</button></div><div class="match-section"><div class="course-list"><span class="free-tag" style="background:#d4e5ec">📚 ${s.courses.length}门课</span><span class="free-tag" style="background:#d4e5ec">📅 ${new Date(s.addedTime).toLocaleDateString()}</span></div><div class="empty-state" style="padding:8px 0; font-size:12px">${s.rawText.split('\n').slice(0,3).join('<br>')}${s.rawText.split('\n').length>3?'<br>...':''}</div></div></div>`}container.innerHTML=html}
    function renderMy(){let saved=localStorage.getItem('my_schedule_text_v2')||getDefaultMy();document.getElementById('myScheduleDisplay').innerHTML=`<textarea id="myEditor" rows="12" style="width:100%; border-radius:24px; padding:14px;">${saved}</textarea><button class="btn" onclick="updateMy()" style="margin-top:12px">💾 保存我的课表</button><div class="empty-state" style="padding:12px; text-align:left">💡 修改后点击保存，匹配结果自动更新</div>`}
    function updateMy(){let t=document.getElementById('myEditor').value;let c=parseSchedule(t);if(!c.length){alert('课表解析失败');return}saveMy(t);alert(`✅ 已更新 ${c.length} 门课程`)}
    function renderAll(){renderMatch();renderList();renderMy()}
    function initTabs(){document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{let id=t.dataset.tab;document.querySelectorAll('.tab').forEach(tt=>tt.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById(id+'Tab').classList.add('active');if(id==='list')renderList();if(id==='match')renderMatch();if(id==='myself')renderMy()})})}
    loadMy();loadStudents();initTabs();renderAll();
</script>
</body>
</html>
