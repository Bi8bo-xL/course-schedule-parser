<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>删除作业</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th { background: #f8f9fa; }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #c0392b; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h1>❌ 删除作业</h1>
    <p style="color: #666;">点击删除按钮移除作业</p>

    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>作业名称</th>
                <th>课程</th>
                <th>截止日期</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="homeworkList">
            <tr><td colspan="5" style="text-align:center">暂无作业</td></tr>
        </tbody>
    </table>

    <div id="message" class="message"></div>
    <a href="course_schedule.html" class="back-link">← 返回课表</a>
</div>

<script>
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = 'message ' + type;
        setTimeout(() => {
            msgDiv.className = 'message';
            window.location.href = 'course_schedule.html';
        }, 1500);
    }

    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const index = this.dataset.index;
            let homework = [];
            try {
                const existing = localStorage.getItem('homework_temp');
                if (existing) homework = JSON.parse(existing);
            } catch(e) {}

            if (homework[index]) {
                const removed = homework.splice(index, 1);
                localStorage.setItem('homework_temp', JSON.stringify(homework));
                showMessage('✅ 已删除：' + removed[0].name, 'success');
            }
        });
    });
</script>
</body>
</html>
